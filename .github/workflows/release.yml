name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # No registry-url on purpose: it writes
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc, and with
          # the secret retired that line is an empty bearer token - the registry
          # answers 404 on PUT instead of letting pnpm do the OIDC exchange.
      - name: Refuse a tag that does not name the package version
        run: node scripts/check-tag-version.mjs "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run typecheck:ci
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run verify:self-contained
      - run: pnpm run verify:artifacts
      - name: Render the changelog section for the release body
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      # Trusted publishing: the OIDC token (id-token: write at the top) replaces the
      # long-lived NPM_TOKEN, so this step reads no secret. pnpm performs the OIDC
      # exchange itself (proven by this package's 0.2.12 release).
      - name: Upgrade npm and show what the publish will authenticate with
        run: |
          npm install -g npm@^11.5.1
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"
          echo "registry: $(npm config get registry)"
          if [ -f .npmrc ]; then echo "--- workspace .npmrc ---"; cat .npmrc; else echo "no workspace .npmrc"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "OIDC request TOKEN: present"; else echo "OIDC request TOKEN: MISSING"; fi
      - run: pnpm publish --no-git-checks --access public --provenance
        env:
          # pnpm/npm's OIDC exchange never throws: failures are only visible at
          # verbose level, otherwise the step just fails with no reason.
          NPM_CONFIG_LOGLEVEL: verbose
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
